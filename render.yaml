services:
  - type: web
    name: giveaway
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: NEXT_PUBLIC_WC_PROJECT_ID
        sync: false
